<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Enviado</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container d-flex justify-content-center">
        <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-check-circle" style="font-size: 60px; color: #28a745;"></i>
                </div>

                <h2 class="text-center mb-2">
                    <span style="color: #1e90ff; font-weight: bold;">ESPECIALISTA</span>
                </h2>

                <h4 class="text-center text-muted mb-4">E-mail Enviado!</h4>

                <div class="alert alert-info" role="alert">
                    <p class="mb-0">
                        <strong>Verifique sua caixa de entrada!</strong>
                    </p>
                    <small>Enviamos um link para recuperar sua senha. 
                    <br>Se não receber em alguns minutos, verifique sua pasta de spam.</small>
                </div>

                <p class="text-center text-muted mb-4">
                    O link que enviamos é válido por <strong>1 dia</strong>.
                </p>

                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-bold">
                    VOLTAR AO LOGIN
                </a>

                <hr class="my-4">

                <p class="text-center text-muted small">
                    Não recebeu o e-mail? <a href="{% url 'password_reset' %}" class="text-primary fw-bold">Tentar novamente</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
