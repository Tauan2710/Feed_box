<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Alterada com Sucesso</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container d-flex justify-content-center">
        <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-check-circle" style="font-size: 60px; color: #28a745;"></i>
                </div>

                <h2 class="text-center mb-2">
                    <span style="color: #1e90ff; font-weight: bold;">ESPECIALISTA</span>
                </h2>

                <h4 class="text-center text-muted mb-4">Senha Alterada com Sucesso!</h4>

                <div class="alert alert-success" role="alert">
                    <p class="mb-0">
                        <strong>Sua senha foi alterada.</strong>
                    </p>
                    <small>Você agora pode fazer login com sua nova senha.</small>
                </div>

                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-bold">
                    IR PARA LOGIN
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
